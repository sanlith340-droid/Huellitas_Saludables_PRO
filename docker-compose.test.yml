services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${TEST_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-test-password}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: ./back
      dockerfile: Dockerfile
    environment:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: db-test
      DB_PORT: 5432
      DB_NAME: proyectohs
      DB_NAME_TEST: proyectohs_test
      DB_USER: ${TEST_DB_USER:-postgres}
      DB_PASSWORD: ${TEST_DB_PASSWORD:-test-password}
      JWT_SECRET: test-only-jwt-secret
      CORS_ORIGIN: '*'
    depends_on:
      db-test:
        condition: service_healthy
    entrypoint: []
    command: ["npm", "test", "--", "--runInBand"]
