# Blueprint de Render (https://render.com/docs/blueprint-spec): crea BD + API + sitio web.
# Uso: subir el repo a GitHub → Render → New → Blueprint → seleccionar el repo.
# Las variables marcadas sync:false se piden en el panel (no se guardan en el repo).
databases:
  - name: huellitas-db
    databaseName: proyectohs
    plan: free            # cambiar a un plan de pago para tener respaldos automáticos
    postgresMajorVersion: "16"

services:
  - type: web
    name: huellitas-api
    runtime: docker
    dockerfilePath: ./back/Dockerfile
    dockerContext: ./back
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: huellitas-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: DB_SEED
        value: "false"
      - key: CORS_ORIGIN          # URL del sitio web, p. ej. https://huellitas-web.onrender.com
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: huellitas-web
    runtime: static
    rootDir: front
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL         # p. ej. https://huellitas-api.onrender.com/api
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
